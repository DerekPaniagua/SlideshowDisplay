<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Office Display</title>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <header class="topbar">
        <img class="logo" src="/pandenlogo.png" alt="" />
        <div class="clock">
            <div id="clock-time" class="clock-time"></div>
            <div id="clock-date" class="clock-date"></div>
        </div>
    </header>

    <section class="calendar-panel">
        <div id="calendar"></div>
    </section>

    <section class="slideshow">
        <img id="slide-0" class="slide placeholder is-visible is-front" src="/pandenlogo.png" alt="" />
        <img id="slide-1" class="slide" alt="" />
    </section>

    <script src="/vendor/fullcalendar/index.global.min.js"></script>
    <script src="/javascript/calendar.js"></script>
    <script src="/javascript/slideshow.js"></script>
    <script src="/javascript/display.js"></script>
</body>

</html>
